<!doctype html>
<!-- Nuxt SPA 挂载前的个性化 Loading（spa-loading-template），应用就绪后被自动替换 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .skv {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #f9fafb, #f3f4f6);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .skv-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        animation: skv-rise 0.6s ease both;
      }
      /* 文档卡片：模拟"正在打开一篇 Markdown" */
      .skv-doc {
        width: 280px;
        padding: 24px 26px;
        background: #fff;
        border: 1px solid rgba(229, 231, 235, 0.8);
        border-radius: 12px;
        box-shadow:
          0 10px 40px -5px rgba(0, 0, 0, 0.1),
          0 15px 50px -8px rgba(0, 0, 0, 0.06);
        animation: skv-float 3s ease-in-out infinite 1.8s;
      }
      .skv-doc::before {
        content: "";
        display: block;
        width: 64px;
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        margin-bottom: 18px;
      }
      .skv-line {
        height: 10px;
        border-radius: 5px;
        background: #e5e7eb;
        width: 0;
        animation: skv-type 0.55s ease-out forwards;
      }
      .skv-line + .skv-line {
        margin-top: 14px;
      }
      .skv-line.l1 {
        animation-delay: 0.5s;
      }
      .skv-line.l2 {
        animation-delay: 0.85s;
      }
      .skv-line.l3 {
        animation-delay: 1.2s;
      }
      .skv-line.l4 {
        animation-delay: 1.55s;
      }
      .skv-caret {
        display: inline-block;
        width: 3px;
        height: 14px;
        margin-top: 14px;
        background: #3b82f6;
        border-radius: 1.5px;
        animation: skv-blink 0.9s step-end infinite;
      }
      /* 品牌区 */
      .skv-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .skv-logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 25px -2px rgba(37, 99, 235, 0.4);
      }
      .skv-name {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      /* 跳动圆点 */
      .skv-dots {
        display: flex;
        gap: 8px;
      }
      .skv-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #93c5fd;
        animation: skv-bounce 1.2s ease-in-out infinite;
      }
      .skv-dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .skv-dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes skv-type {
        to {
          width: var(--w, 70%);
        }
      }
      @keyframes skv-blink {
        50% {
          opacity: 0;
        }
      }
      @keyframes skv-bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-6px);
        }
      }
      @keyframes skv-rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes skv-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      /* 暗色模式（由下方内联脚本按用户持久化设置预先切换） */
      .dark .skv {
        background: linear-gradient(135deg, #111827, #1f2937);
      }
      .dark .skv-doc {
        background: #1f2937;
        border-color: rgba(55, 65, 81, 0.6);
        box-shadow: 0 10px 40px -5px rgba(0, 0, 0, 0.45);
      }
      .dark .skv-line {
        background: #374151;
      }
      .dark .skv-caret {
        background: #60a5fa;
      }
      .dark .skv-name {
        background: linear-gradient(90deg, #60a5fa, #93c5fd);
        -webkit-background-clip: text;
        background-clip: text;
      }
      .dark .skv-dots i {
        background: #3b82f6;
      }
      .dark .skv-logo {
        box-shadow: 0 4px 25px -2px rgba(59, 130, 246, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="skv">
      <div class="skv-stage">
        <div class="skv-doc">
          <div class="skv-line l1" style="--w: 92%"></div>
          <div class="skv-line l2" style="--w: 70%"></div>
          <div class="skv-line l3" style="--w: 82%"></div>
          <div class="skv-line l4" style="--w: 45%"></div>
          <span class="skv-caret"></span>
        </div>
        <div class="skv-brand">
          <div class="skv-logo">
            <svg
              style="width: 24px; height: 24px"
              fill="none"
              stroke="#fff"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
          </div>
          <div class="skv-name">MD Viewer</div>
        </div>
        <div class="skv-dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      // 在应用挂载前按用户持久化设置恢复主题，避免亮/暗色闪烁
      try {
        var settings = JSON.parse(
          localStorage.getItem("md-viewer-settings") || "{}",
        );
        if (settings.theme === "dark") {
          document.documentElement.classList.add("dark");
        } else if (settings.theme === "eye-care") {
          document.documentElement.style.backgroundColor = "#f5f5dc";
        }
      } catch (e) {}
    </script>
  </body>
</html>
